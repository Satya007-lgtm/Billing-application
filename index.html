<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable Billing System | Satyanarayana Sadanala</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <!-- Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://cdn-icons-png.flaticon.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://*;">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- App Lock Overlay -->
    <div id="app-lock-screen" class="lock-screen" style="display: none;">
        <div class="lock-content fade-in">
            <div class="lock-icon-wrapper">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="fingerprint-svg">
                    <path d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10"></path>
                    <path d="M5 15c0-3.866 3.134-7 7-7s7 3.134 7 7"></path>
                    <path d="M8 18c0-2.209 1.791-4 4-4s4 1.791 4 4"></path>
                    <circle cx="12" cy="12" r="1"></circle>
                    <path d="M12 12v5"></path>
                    <path d="M9 22h6"></path>
                </svg>
            </div>
            <h2 data-i18n="lock-title">App Locked</h2>
            <p data-i18n="lock-msg">Please authenticate to continue</p>
            <button id="unlock-btn" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">
                <span data-i18n="btn-unlock">Unlock with Biometrics</span>
            </button>
        </div>
    </div>

    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo" data-i18n="app-title">Vegetable Billing</div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
                <button class="btn btn-outline nav-tool-btn"
                    style="border-color: var(--accent-secondary); color: var(--accent-secondary);"
                    onclick="exportData()" data-i18n="btn-backup">Backup</button>
                <button class="btn btn-outline nav-tool-btn"
                    style="border-color: var(--accent-primary); color: var(--accent-primary);" onclick="triggerImport()"
                    data-i18n="btn-restore">Restore</button>
                <button class="btn btn-outline nav-tool-btn" style="border-color: #f1f5f9; color: #f1f5f9;"
                    onclick="openRecycleBin()" data-i18n="btn-recover">Recycle Bin</button>
                <input type="file" id="import-input" style="display: none;" accept=".json" onchange="importData(event)">
                <button id="toggle-lock-btn" class="btn btn-outline nav-tool-btn"
                    style="border-color: #f59e0b; color: #f59e0b;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span data-i18n="btn-lock-setup">Lock Setup</span>
                </button>

                <select id="lang-select" class="glass-input nav-tool-btn" style="width: auto;">
                    <option value="en">English</option>
                    <option value="te">తెలుగు (Telugu)</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="section-header fade-in">
            <h1 data-i18n="header-main">Vegetable <span class="accent">Billing</span></h1>
            <p class="subtitle" data-i18n="header-sub">Efficient data entry for vegetable inventory and sales.</p>
        </header>

        <section class="billing-grid">
            <!-- Data Entry Form -->
            <div class="card form-card fade-in">
                <h3 data-i18n="form-title">Add New Entry</h3>
                <form id="billing-form">
                    <div class="form-group">
                        <label for="entry-date" data-i18n="label-date">Date</label>
                        <input type="date" id="entry-date" required class="glass-input">
                    </div>
                    <div class="form-group">
                        <label for="name" data-i18n="label-name">Customer Name</label>
                        <div class="input-with-icon">
                            <input type="text" id="name" placeholder="Enter name" required class="glass-input"
                                data-i18n-placeholder="placeholder-name">
                            <button type="button" class="voice-btn" onclick="startVoiceInput('name')"
                                title="Voice Input">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                    <line x1="12" y1="19" x2="12" y2="23"></line>
                                    <line x1="8" y1="23" x2="16" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="vegetable" data-i18n="label-veg">Vegetable</label>
                        <div class="input-with-icon">
                            <input type="text" id="vegetable" placeholder="e.g. Tomato, Onion" required
                                class="glass-input" data-i18n-placeholder="placeholder-veg">
                            <button type="button" class="voice-btn" onclick="startVoiceInput('vegetable')"
                                title="Voice Input">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                    <line x1="12" y1="19" x2="12" y2="23"></line>
                                    <line x1="8" y1="23" x2="16" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price" data-i18n="label-price">Price (per Kg)</label>
                            <input type="number" id="price" step="0.01" placeholder="0.00" required class="glass-input">
                        </div>
                        <div class="form-group">
                            <label for="kgs" data-i18n="label-kgs">Quantity (Kgs)</label>
                            <input type="number" id="kgs" step="0.1" placeholder="0.0" required class="glass-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="due" data-i18n="label-due">Due Amount</label>
                        <input type="number" id="due" step="0.01" value="0.00" class="glass-input">
                    </div>
                    <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <button type="submit" id="submit-btn" class="btn btn-primary" style="flex: 1;"
                            data-i18n="btn-add">Add to Bill</button>
                        <button type="button" id="cancel-edit" class="btn btn-outline"
                            style="display: none; flex: 1; border-color: #64748b; color: #64748b;"
                            data-i18n="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Grouped Data Display Container -->
            <div id="grouped-tables-container" style="display: flex; flex-direction: column; gap: 3rem;">
                <!-- Tables for each person will be dynamically generated here -->
            </div>
        </section>
    </main>

    <footer class="fade-in">
        <div
            style="margin-bottom: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem; color: #22c55e; font-size: 0.8rem; font-weight: 600;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span data-i18n="security-verified">Secure & Virus-Free Verified</span>
        </div>
        <p data-i18n="footer-text">© 2025 Satyanarayana Sadanala. Built for High-Impact Analytics.</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
